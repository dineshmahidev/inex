workflows:
  android-production:
    name: Tracksy Production (Signed APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing # This matches the group name we discussed
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild
        script: npx expo prebuild --platform android
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/tracksy.keystore
      - name: Build Android Production
        script: |
          cd android
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/tracksy.keystore \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
